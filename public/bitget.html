<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AfterHours · Bitget Arbitrage</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/ah-switch.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0e14;--card:#12161f;--line:#1e2633;--txt:#e6ecf5;--mut:#8b96a8;--grn:#69f0ae;--red:#ff5d5d;--acc:#5aa9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui} 
a{color:var(--acc);text-decoration:none}.wrap{max-width:880px;margin:0 auto;padding:24px}
h1{font-size:22px}h1 small{color:var(--mut);font-weight:400}
nav a{margin-right:14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.up{color:var(--grn)}.down{color:var(--red)}.mut{color:var(--mut)}
button{background:var(--acc);border:0;color:#0b0e14;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;color:var(--grn);background:rgba(105,240,174,.08);border:1px solid rgba(105,240,174,.3);padding:3px 9px;border-radius:20px}
</style></head><body><div class="wrap">
<nav class="wrap" style="display:flex;align-items:center;gap:16px;margin:0 auto;max-width:880px;padding:14px 8px">
  <div style="display:flex;align-items:center;gap:10px"><img src="/logo.png" width="26" height="26" style="border-radius:7px"><b style="font-size:15px">AfterHours</b></div>
  <div style="flex:1"></div>
  <div class="ah-switch" style="margin-left:auto">
    <span class="lbl">Products</span>
    <a href="/app" class="ah-pill sol"><span class="dot"></span>Solana<small>· on-chain desk</small></a>
    <a href="/bnb" class="ah-pill bnb"><span class="dot"></span>BNB<small>· bStocks/Ondo gap</small></a>
    <a href="/bitget" class="ah-pill bga active"><span class="dot"></span>Bitget<small>· rToken arb</small></a>
  </div>
  <a href="/docs" style="font-size:12px;color:var(--mut)">Docs</a>
</nav>
<h1>AfterHours · <small>Bitget S2 — Alpha Factory · Arbitrage</small></h1>
<div class="card row" id="status"><div class="mut">Loading Bitget rToken vs US reference…</div><span class="badge">bitget UTA v3</span></div>
<div class="card">
  <div class="row"><b>rToken vs native reference</b><span class="mut" id="meta"></span></div>
  <p class="mut" id="note"></p>
  <table><thead><tr><th>Symbol</th><th>rToken</th><th>rToken $</th><th>Ref $</th><th>Gap</th><th>Dir</th></tr></thead>
  <tbody id="body"></tbody></table>
  <button onclick="act()" style="margin-top:14px">Paper-act · top |gap| ($100)</button>
</div>
<script>
const $=s=>document.querySelector(s), fmt=n=>n==null?'—':'$'+Number(n).toFixed(2);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function get(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
  try{
    const d=await get('/api/bitget/arbitrage');
    $('#status').innerHTML='<b>Bitget Arbitrage leg — live</b><span class="badge">'+d.chain+' · UTA v3 rToken</span>';
    $('#meta').textContent=d.market.open?'NYSE OPEN':`${d.universe} symbols · ${d.gaps.length} gaps`;
    $('#note').textContent=d.market.note+(d.flaggedCount?` · ${d.flaggedCount} flagged implausible`:'');
    $('#body').innerHTML=(d.gaps||[]).map(g=>{
      const cls=g.gapPct>=0?'up':'down', sign=g.gapPct>=0?'+':'';
      const dir=g.gapPct>=0?'hedge':'buy-disc';
      return `<tr><td><b>${esc(g.symbol)}</b></td><td class="mut">${esc(g.rSymbol)}</td><td>${fmt(g.rTokenPriceUsd)}</td><td class="mut">${fmt(g.referenceUsd)}</td><td class="${cls}">${sign}${g.gapPct.toFixed(2)}%</td><td class="mut">${dir}</td></tr>`;
    }).join('')||'<tr><td colspan="6" class="mut">no gaps</td></tr>';
  }catch(e){$('#body').innerHTML=`<tr><td colspan="6" class="mut">${esc(e.message)}</td></tr>`}
}
async function act(){try{const d=await fetch('/api/bitget/paper-act',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json());alert(d.acted?`Paper: ${d.target} ${d.side} $${d.notionalUsd} (gap ${d.gapPct.toFixed(2)}%)`:`No tradable gap.`)}catch(e){alert(e.message)}}
load();
</script></div></body></html>
